quarkus:
  native:
    # if needed add -H:+UnlockExperimentalVMOptions
    additional-build-args: -H:IncludeResources=unit-test-demo-app/fm-doc-process-config.xml,\
      -H:IncludeResources=unit-test-demo-app/template/document.ftl

smallrye:
  jwt:
    sign:
      issuer: https://unittestdemoapp.fugerit.org
      key:
        location: /security/privateKey.pem

mp:
  jwt:
    verify:
      issuer: https://unittestdemoapp.fugerit.org
      publickey:
        location: /security/publicKey.pem


